<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 時代的人文素養 — 高二英文教案入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #e5e1d8; --surface: #dad5ca; --ink: #2a1d17; --muted: #5a4a40; --accent: #456f3a; --accent-ink: #fff; --margin: clamp(20px, 4vw, 48px); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Epilogue", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem); line-height: 1.6; }
a { color: inherit; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
header.top { padding: 28px var(--margin) 0; font-size: 0.9375rem; font-weight: 900; letter-spacing: -0.02em; }
.hero { min-height: 60svh; display: grid; grid-template-columns: 4fr 8fr; column-gap: 32px; align-content: end; padding: 0 var(--margin) 64px; }
.hero h1 { grid-column: 2; grid-row: 1; font-weight: 900; font-size: clamp(3rem, 8.4vw, 8.5rem); line-height: 0.95; letter-spacing: -0.04em; }
.hero p { grid-column: 1; grid-row: 1; align-self: end; max-width: 30ch; font-size: clamp(1.15rem, 1.05rem + 0.5vw, 1.5rem); line-height: 1.4; color: var(--muted); }
.mask { display: block; overflow: hidden; padding-bottom: 0.08em; }
.mask > span { display: block; }
.js .mask > span { transform: translateY(105%); animation: rise 900ms cubic-bezier(.16,1,.3,1) forwards; }
.js .mask:nth-child(2) > span { animation-delay: 110ms; }
@keyframes rise { to { transform: translateY(0); } }
.pages { background: var(--surface); padding: 120px var(--margin); display: grid; grid-template-columns: 4fr 8fr; column-gap: 32px; }
.pages h2 { font-weight: 900; font-size: clamp(2rem, 1.2rem + 3.4vw, 4.25rem); line-height: 1; letter-spacing: -0.04em; }
.pages ul { list-style: none; display: grid; gap: 56px; }
.pages a.page { display: block; text-decoration: none; transition: transform 200ms ease; }
.pages a.page:hover { transform: translateX(8px); }
.pages a.page strong { display: block; font-weight: 900; font-size: clamp(2rem, 4.4vw, 4rem); line-height: 1; letter-spacing: -0.03em; }
.pages a.page:hover strong, .pages a.page:focus-visible strong { color: var(--accent); }
.pages a.page span { display: block; margin-top: 10px; max-width: 40ch; color: var(--muted); }
footer { background: var(--ink); color: var(--bg); padding: 40px var(--margin) 28px; font-size: 0.9375rem; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .hero { display: block; min-height: 66svh; padding-bottom: 40px; }
  .hero h1 { font-size: 12.5vw; margin: 22svh 0 24px; }
  .pages { display: block; padding: 80px var(--margin); }
  .pages h2 { margin-bottom: 40px; }
}
@media (prefers-reduced-motion: reduce) { .js .mask > span { transform: none; animation: none; } .pages a.page { transition: none; } }
</style>
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
<header class="top">英文・高二</header>
<main>
  <div class="hero">
    <h1><span class="mask"><span>AI 時代的</span></span><span class="mask"><span>人文素養</span></span></h1>
    <p>高二英文，50 分鐘 × 2 堂。從美國大學開設 AI 學位談起。</p>
  </div>
  <section class="pages" aria-labelledby="h-pages">
    <h2 id="h-pages">兩個網頁</h2>
    <ul>
      <li><a class="page" href="ai-humanities-course-site.html"><strong>課程官網</strong><span>完整教案：教學概覽、目標、時間流程、差異化設計、啟發提問、摘要與宣傳文案。</span></a></li>
      <li><a class="page" href="ai-humanities-practice-game.html"><strong>闖關練習</strong><span>學生用的互動練習：詞彙、事實或看法、閱讀理解、AI 倫理立場。</span></a></li>
    </ul>
  </section>
</main>
<footer><span>教案為草案，請教師確認後使用</span><span>素材出處：中央社 2026/8/28</span></footer>
</body>
</html>
