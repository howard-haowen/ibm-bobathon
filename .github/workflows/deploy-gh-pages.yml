name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'workshops/**/artifacts/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble _site/
        run: |
          mkdir -p _site
          touch _site/.nojekyll

          # Copy each workshop's artifacts into _site/workshops/<slug>/
          for dir in workshops/*/artifacts; do
            [ -d "$dir" ] || continue
            slug=$(echo "$dir" | cut -d/ -f2)
            mkdir -p "_site/workshops/$slug"
            cp -r "$dir/." "_site/workshops/$slug/"
          done

          # Generate Hub index.html using Node.js script for Carbon Design styling
          node -e '
          const fs = require("fs");
          const path = require("path");

          const siteDir = "_site";
          const workshopsDir = path.join(siteDir, "workshops");

          let workshops = [];
          if (fs.existsSync(workshopsDir)) {
            const dirs = fs.readdirSync(workshopsDir).filter(d => fs.statSync(path.join(workshopsDir, d)).isDirectory());
            dirs.sort();

            for (const slug of dirs) {
              const indexPath = path.join(workshopsDir, slug, "index.html");
              let title = slug.toUpperCase();
              let eyebrow = "工作坊";
              let desc = "點擊進入查看此工作坊的所有報告與教材。";

              if (fs.existsSync(indexPath)) {
                const html = fs.readFileSync(indexPath, "utf-8");
                const titleMatch = html.match(/<title>(.*?)<\/title>/i) || html.match(/<h1[^>]*>(.*?)<\/h1>/i);
                if (titleMatch && titleMatch[1]) {
                  title = titleMatch[1].replace(/<[^>]+>/g, "").trim();
                }
                const descMatch = html.match(/<p[^>]*class="[^"]*hero-desc[^"]*"[^>]*>(.*?)<\/p>/i) || html.match(/<main[\s\S]*?<p[^>]*>(.*?)<\/p>/i);
                if (descMatch && descMatch[1]) {
                  desc = descMatch[1].replace(/<[^>]+>/g, "").trim();
                }
              }

              workshops.push({ slug, title, eyebrow, desc });
            }
          }

          const cardsHtml = workshops.map(w => `
            <a class="card" href="workshops/${w.slug}/">
              <p class="card-eyebrow">${w.eyebrow} · ${w.slug.toUpperCase()}</p>
              <h2>${w.title}</h2>
              <p>${w.desc}</p>
              <span class="card-cta">進入工作坊</span>
            </a>
          `).join("\n");

          const hubIndex = `<!DOCTYPE html>
          <html lang="zh-TW">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>IBM Bob 工作坊 Hub</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap">
            <style>
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
                font-size: 16px;
                font-weight: 400;
                line-height: 1.5;
                letter-spacing: 0.16px;
                color: #161616;
                background: #ffffff;
              }
              .utility-bar {
                background: #f4f4f4;
                color: #525252;
                font-size: 12px;
                letter-spacing: 0.32px;
                line-height: 1.33;
                height: 32px;
                display: flex;
                align-items: center;
                padding: 0 32px;
                border-bottom: 1px solid #e0e0e0;
              }
              .top-nav {
                background: #ffffff;
                border-bottom: 1px solid #e0e0e0;
                height: 48px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 32px;
              }
              .top-nav .logo {
                font-size: 18px;
                font-weight: 600;
                color: #161616;
                text-decoration: none;
              }
              .top-nav .logo span { color: #0f62fe; }
              .top-nav .github-link {
                font-size: 14px;
                color: #0f62fe;
                text-decoration: none;
              }
              .top-nav .github-link:hover { text-decoration: underline; }
              .page-content {
                max-width: 1056px;
                margin: 0 auto;
                padding: 64px 32px 96px;
              }
              .hero {
                margin-bottom: 48px;
                padding-bottom: 40px;
                border-bottom: 1px solid #e0e0e0;
              }
              .hero-eyebrow {
                font-size: 14px;
                color: #525252;
                letter-spacing: 0.16px;
                margin-bottom: 12px;
              }
              .hero h1 {
                font-size: 42px;
                font-weight: 300;
                line-height: 1.2;
                color: #161616;
                margin-bottom: 16px;
              }
              .hero p {
                font-size: 18px;
                color: #525252;
                line-height: 1.5;
                max-width: 640px;
              }
              .section-label {
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.32px;
                color: #525252;
                text-transform: uppercase;
                margin-bottom: 16px;
              }
              .card-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 1px;
                background: #e0e0e0;
                border: 1px solid #e0e0e0;
              }
              .card {
                background: #ffffff;
                padding: 24px;
                text-decoration: none;
                color: inherit;
                display: flex;
                flex-direction: column;
                gap: 12px;
                transition: background 0.1s;
              }
              .card:hover { background: #f4f4f4; }
              .card-eyebrow {
                font-size: 12px;
                letter-spacing: 0.32px;
                color: #0f62fe;
              }
              .card h2 {
                font-size: 20px;
                font-weight: 400;
                line-height: 1.4;
                color: #161616;
              }
              .card p {
                font-size: 14px;
                color: #525252;
                line-height: 1.29;
                flex: 1;
              }
              .card-cta {
                font-size: 14px;
                color: #0f62fe;
                margin-top: 8px;
                display: flex;
                align-items: center;
                gap: 4px;
              }
              .card-cta::after { content: " →"; }
              footer {
                background: #161616;
                color: #c6c6c6;
                font-size: 14px;
                padding: 32px;
                text-align: center;
                border-top: 1px solid #262626;
              }
              footer span { font-size: 12px; color: #8c8c8c; }
              @media (max-width: 672px) {
                .utility-bar { display: none; }
                .page-content { padding: 40px 16px 64px; }
                .hero h1 { font-size: 32px; }
              }
            </style>
          </head>
          <body>
            <div class="utility-bar">IBM Bob · 工作坊 Hub</div>
            <nav class="top-nav">
              <a class="logo" href="index.html">IBM <span>Bob</span> Hub</a>
              <a class="github-link" href="https://github.com/howard-haowen/ibm-bobathon" target="_blank" rel="noopener noreferrer">GitHub</a>
            </nav>
            <main class="page-content">
              <div class="hero">
                <p class="hero-eyebrow">工作坊總覽</p>
                <h1>IBM Bob 工作坊 Hub</h1>
                <p>匯集所有 IBM Bob 工作坊教學教材與產出報告。</p>
              </div>
              <p class="section-label">所有工作坊（${workshops.length}）</p>
              <div class="card-grid">
                ${cardsHtml}
              </div>
            </main>
            <footer>
              <span>Made with IBM Bob</span>
            </footer>
          </body>
          </html>
          `;

          fs.writeFileSync(path.join(siteDir, "index.html"), hubIndex.trim(), "utf-8");
          console.log(`✔ Generated _site/index.html with ${workshops.length} workshop(s)`);
          '

      - name: Deploy _site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
          commit_message: 'deploy: sync all workshops from main (${{ github.sha }})'
